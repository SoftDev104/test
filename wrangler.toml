name = "registrazione-gioco"
main = "worker.js"
compatibility_date = "2025-09-01"

# La tua pagina: metti il tuo index.html nella cartella "public"
[assets]
directory = "./public"

# Dove vengono salvati gli username (incolla qui l'id che ottieni al passo 4 della guida)
[[kv_namespaces]]
binding = "UTENTI"
id = "INCOLLA_QUI_L_ID"

[vars]
# Link del tuo gioco: gli utenti ci arrivano dopo la registrazione
GAME_URL = "https://il-tuo-sito.example/gioco"
